<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorteo Globo de Nombres con Haz de Luz</title>
  <link rel="stylesheet" href="style2.css" />  
</head>
<body>
  <h1 id="titulo">🎉 SORTEO CLUB DE CLIENTES 🎉</h1>
  <div id="legend">
    <div class="item"><span class="circle blue"></span> 1–3 compras</div>
    <div class="item"><span class="circle yellow"></span> 4–7 compras</div>
    <div class="item"><span class="circle red"></span> 8–15 compras</div>
    <div class="item"><span class="circle green"></span> +15 compras</div>
  </div>
  
  <canvas id="globo"></canvas>
  <div id="controls">
    <button id="startBtn">Comenzar Sorteo</button>
    <button id="resetBtn">Reset Ganador</button> 
    <button id="showWinnerBtn" style="display:none;">
  Mostrar Ganador
</button>
    
  </div>  
  <div id="ganadorBox"></div>
<script>
   

const MODO_REVELACION_GRANDE = true;

const canvas = document.getElementById('globo');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let puntos = [];

  function obtenerColorPorCompras(puntos){
    if(puntos >= 1 && puntos <= 3) return "rgb(215, 119, 227)";
    if(puntos >= 4 && puntos <= 7) return "rgb(228,236,140)";
    if(puntos >= 8 && puntos <= 15) return "rgb(238,72,72)";
    if(puntos > 15) return "rgb(94,199,94)";
    return "white";
  }

 async function cargarDatos() {
  try {
    const BASE_URL = "https://script.google.com/macros/s/AKfycbwUl31-IGLZR8j8EotlvdjdIKTZDTIaZkdfMRfLf87eO0QU20Reuqc9vizYMV6BIUQq/exec";
    const KEY = "CLUB2026SEGURA";
    const response = await fetch(`${BASE_URL}?modo=sorteo&key=${KEY}`);
    const data = await response.json();

    if (!data || data.length === 0) {
      alert("No hay participantes en la hoja");
      return;
    }

    puntos = data.map((item, i) => {
      const phi = Math.acos(-1 + (2 * i) / data.length);
      const theta = Math.sqrt(data.length * Math.PI) * phi;

      return {
        texto: item.telefono,
        compras: parseInt(item.puntos) || 1,
        phi,
        theta,
        color: obtenerColorPorCompras(parseInt(item.puntos)),
        sinPhi: Math.sin(phi),
        cosPhi: Math.cos(phi)
      };
    });

  } catch (error) {
    console.error("Error cargando participantes:", error);
    alert("Error cargando participantes");
  }
}  

  let rotY = 0, ganador = null, confeti = [], scannerAngle = 0, buscando = false, vueltas = 0;

  const radiusSmall = Math.min(canvas.width/2, canvas.height/2)*0.4;
  const radiusLarge = Math.min(canvas.width/2, canvas.height/2)*0.7;
  let radiusAnim = radiusSmall; 
  let targetRadius = radiusSmall;
  let velocity = 0;

  class Confeti {
    constructor(originSide) {
      this.x = originSide === 'left' ? 0 : canvas.width;
      this.y = canvas.height;
      this.size = Math.random() * 6 + 3;
      this.color = `hsl(${Math.random()*360},100%,50%)`;
      const angleRange = originSide === 'left' ? [15,75] : [105,165];
      const angleDeg = Math.random()*(angleRange[1]-angleRange[0])+angleRange[0];
      const angle = angleDeg * Math.PI/180;
      const speed = Math.random()*20+20;
      this.vx = Math.cos(angle)*speed;
      this.vy = -Math.sin(angle)*speed;
      this.gravity = 0.25;
      this.friction = 0.98;
      this.rotation = Math.random() * 360;
      this.rotationSpeed = (Math.random()-0.5)*10;
      this.hitCeiling = false;
    }
    

    update(alturaTituloPx) {
      this.vx *= this.friction;
      this.vy *= this.friction;
      this.x += this.vx;
      this.y += this.vy;
      this.rotation += this.rotationSpeed;

      if (!this.hitCeiling) {
        if (this.y <= alturaTituloPx && this.vy < 0) {
          this.hitCeiling = true;
          this.vy = Math.random() * 5 + 2;
          this.vx = (Math.random() - 0.5) * 4;
        } else {
          this.vy += this.gravity;
        }
      } else {
        this.vy += 0.9;
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rotation * Math.PI/180);
      ctx.fillStyle = this.color;
      ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
      ctx.restore();
    }
  }
function lanzarConfeti(){
  for(let i = 0; i < 80; i++){
    const lado = Math.random() > 0.5 ? 'left' : 'right';
    confeti.push(new Confeti(lado));
  }
}
  function dibujar(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const cx = canvas.width/2, cy = canvas.height/2;

    const stiffness = 0.15;
    const damping = 0.75;
    let force = (targetRadius - radiusAnim) * stiffness;
    velocity = (velocity + force) * damping;
    radiusAnim += velocity;

    puntos.forEach(p=>{
      const x = radiusAnim * p.sinPhi * Math.cos(p.theta+rotY);
      const y = radiusAnim * p.cosPhi;
      const z = radiusAnim * p.sinPhi * Math.sin(p.theta+rotY);
      const scale = 300/(300+z);
      const px = cx + x*scale, py = cy + y*scale;

      let angle = (p.theta+rotY) % (2*Math.PI);
      let diff = Math.abs(scannerAngle - angle);

      if(buscando && diff < 0.3){
        ctx.fillStyle = "rgba(0,255,255,0.9)";
        ctx.font = `${16*scale}px Arial Black`;
      } else {
        ctx.fillStyle = p.color;
        ctx.font = `${12*scale}px Arial`;
      }

      ctx.globalAlpha = scale/2;
      ctx.fillText(p.texto, px, py);
    });

    ctx.globalAlpha = 1;

    confeti.forEach((c, i) => {
      c.update(-10);
      c.draw(ctx);
      if(c.y > canvas.height){
        confeti.splice(i,1);
      }
    });

    rotY += 0.02;

    if(buscando){
      scannerAngle += 0.05;
      if(scannerAngle > 2*Math.PI){ scannerAngle = 0; vueltas++; }
    }

    requestAnimationFrame(dibujar);
  }

 function buscarGanador(){
  buscando = true;
  vueltas = 0;
  scannerAngle = 0;
  targetRadius = radiusLarge;

  document.getElementById("controls").style.display = "none";
  document.getElementById("legend").style.display = "none";
  document.getElementById("titulo").style.display = "none";
  document.getElementById("ganadorBox").style.display = "none";

  // ⏳ Espera fija de 4 segundos
  setTimeout(()=>{
    buscando = false;
    elegirGanador();
  }, 4000);
}  

// =============================
// 🎯 ELEGIR GANADOR
// =============================
 function elegirGanador(){

  if(!puntos || puntos.length === 0){
    alert("No hay participantes");
    return;
  }

  let totalPeso = 0;

  puntos.forEach(p => {
    p.compras = parseInt(p.compras) || 0;
    totalPeso += p.compras;
  });

  if(totalPeso === 0){
    alert("Todos los participantes tienen 0 puntos");
    return;
  }

  let random = Math.random() * totalPeso;
  let acumulado = 0;

  for(let p of puntos){
    acumulado += p.compras;
    if(random <= acumulado){
      ganador = p;
      break;
    }
  }

  if(!ganador){
    alert("No se pudo seleccionar ganador");
    return;
  }

  const box = document.getElementById("ganadorBox");
  box.innerHTML = "EL GANADOR ES:<br>" + ganador.texto;                
  box.style.display = "block";

  // mostramos botón revelar
  document.getElementById("showWinnerBtn").style.display = "inline-block";

  targetRadius = radiusSmall;

  document.getElementById("controls").style.display = "flex";
  document.getElementById("legend").style.display = "flex";
  document.getElementById("titulo").style.display = "block";

  lanzarConfeti();
}


// =============================
// 🖥 PANTALLA GRANDE RESPONSIVE
// =============================
function mostrarPantallaGrande(ganador){

  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = "0";
  overlay.style.left = "0";
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "rgba(0,0,0,0.85)";
  overlay.style.display = "flex";
  overlay.style.justifyContent = "center";
  overlay.style.alignItems = "center";
  overlay.style.zIndex = "9999";
  overlay.style.padding = "20px";

  const tarjeta = document.createElement("div");

  const esMobile = window.innerWidth < 600;

  tarjeta.style.background = "#111";
  tarjeta.style.color = "#fff";
  tarjeta.style.padding = esMobile ? "30px 20px" : "60px 100px";
  tarjeta.style.borderRadius = "20px";
  tarjeta.style.textAlign = "center";
  tarjeta.style.width = esMobile ? "100%" : "auto";
  tarjeta.style.maxWidth = "500px";

  tarjeta.innerHTML = `
    <h1 style="font-size:${esMobile ? "28px" : "45px"}; margin-bottom:20px;">
      🎉 EL GANADOR ES 🎉
    </h1>
    <h2 style="font-size:${esMobile ? "36px" : "60px"}; margin:20px 0; color:#00ffcc;">
      ${ganador.texto}
    </h2>
    <button id="cerrarOverlay"
      style="
        padding:12px 30px;
        font-size:18px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        background:#7182f5;
        color:white;">
      Cerrar
    </button>
  `;

  overlay.appendChild(tarjeta);
  document.body.appendChild(overlay);

  document.getElementById("cerrarOverlay").onclick = function(){
    overlay.remove();
  };
}


// =============================
// 🔘 BOTÓN MOSTRAR GANADOR
// =============================
document.getElementById("showWinnerBtn").addEventListener("click", ()=>{

  if(ganador){
    mostrarPantallaGrande(ganador);
  } else {
    alert("Todavía no hay ganador seleccionado");
  }

});
// INICIO
async function iniciar(){
  await cargarDatos();
  dibujar();
}


// 🔘 BOTÓN COMENZAR SORTEO
document.getElementById("startBtn").addEventListener("click", ()=>{
  if(puntos.length === 0){
    alert("No hay participantes cargados");
    return;
  }

  confeti = [];
  ganador = null;
  buscarGanador();
});
// =============================
// 🚀 INICIAR APLICACIÓN
// =============================
document.addEventListener("DOMContentLoaded", async function() {
  try {
    await cargarDatos();
    dibujar();
  } catch (error) {
    console.error("Error iniciando app:", error);
  }
});
 ;  
 
 document.getElementById("resetBtn").addEventListener("click", ()=>{

  ganador = null;
  confeti = [];
  buscando = false;
  vueltas = 0;
  scannerAngle = 0;
  targetRadius = radiusSmall;

  document.getElementById("ganadorBox").style.display = "none";
  document.getElementById("showWinnerBtn").style.display = "none";

});
</script>
<script src="header.js"></script>

</body>
</html>
